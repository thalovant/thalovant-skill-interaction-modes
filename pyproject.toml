[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# The published combo-lock 0.3.1 requires filelock~=3.0, and every 3.x release
# is inside published advisory ranges. On Python 3.11+, uv installs from this
# checkout (CI and the release workflow) use the reviewed combo-lock build the
# hub runtime installs, so filelock>=4.2.1 can resolve. The URL is pinned to a
# commit; uv does not check the #sha256 fragment on an override, while pip, the
# CI install (which also passes .github/ci/runtime-security-requirements.txt)
# and the runtime image do. Keep the two in step. An override replaces every
# requirement on the package, so 3.10 needs its own line, with the caps the
# published dependants already put on combo-lock.
override-dependencies = [
    "combo-lock @ https://github.com/goldyfruit/combo-lock/archive/3aa5c729171ab161e54623c59ca8b41e3451c5f5.tar.gz#sha256=e653deca0dead17177ad141026881899889e8b5c0be5884ebef098d266dc70a7 ; python_version >= '3.11'",
    "combo-lock>=0.3,<0.4 ; python_version < '3.11'",
]
