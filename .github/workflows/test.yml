permissions:
  contents: read

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv venv --python "$(command -v python)" .venv
      - run: uv pip install --python .venv/bin/python --prerelease=allow -e ".[test]" pytest-timeout
      # The test extra includes OVOScope: native routing must run, not skip.
      - run: .venv/bin/python -c "import ovoscope, thalovant_skillkit.testing_ovos"
      - run: .venv/bin/python -m pytest -q --timeout=60
