name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check --select E9,F63,F7,F82 .
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads the checkout and runs installed code; never pushes.
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether runtime tests are needed
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
        if: steps.scope.outputs.run_tests == 'true'
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', '.github/ci/*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
        if: steps.scope.outputs.run_tests == 'true'
      - run: python -m pip install --upgrade uv
        if: steps.scope.outputs.run_tests == 'true'
      - run: uv venv --python "$(command -v python)" .venv
        if: steps.scope.outputs.run_tests == 'true'
      - run: uv pip install --python .venv/bin/python --prerelease=allow -e ".[test]" pytest-timeout -r .github/ci/runtime-security-requirements.txt
        if: steps.scope.outputs.run_tests == 'true'
      - run: .venv/bin/python -m pytest -q --timeout=60
        if: steps.scope.outputs.run_tests == 'true'
