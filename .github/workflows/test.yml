permissions:
  contents: read

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether runtime tests are needed
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
        if: steps.scope.outputs.run_tests == 'true'
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
        if: steps.scope.outputs.run_tests == 'true'
      - run: python -m pip install --upgrade uv
        if: steps.scope.outputs.run_tests == 'true'
      - run: uv venv --python "$(command -v python)" .venv
        if: steps.scope.outputs.run_tests == 'true'
      - run: uv pip install --python .venv/bin/python --prerelease=allow -e ".[test]" pytest-timeout
      # The test extra includes OVOScope: native routing must run, not skip.
        if: steps.scope.outputs.run_tests == 'true'
      - run: .venv/bin/python -c "import ovoscope, thalovant_skillkit.testing_ovos"
        if: steps.scope.outputs.run_tests == 'true'
      - run: .venv/bin/python -m pytest -q --timeout=60
        if: steps.scope.outputs.run_tests == 'true'
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
