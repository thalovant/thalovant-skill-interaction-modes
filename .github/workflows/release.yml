name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, such as v0.1.9"
        required: true
        type: string

permissions:
  contents: read

# Never interrupt a publication half way through. Duplicate dispatches serialize.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package: ${{ steps.wheel.outputs.package }}
      version: ${{ steps.wheel.outputs.version }}
      path: ${{ steps.wheel.outputs.path }}
      sha256: ${{ steps.wheel.outputs.sha256 }}
      channel: ${{ steps.wheel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'setup.py', 'requirements.txt', '.github/workflows/release.yml') }}
      - name: Install verification tools
        run: |
          python -m pip install --upgrade uv
          uv venv .venv
          uv pip install --python .venv/bin/python --prerelease=allow -e ".[test]" build twine pytest-timeout
      - name: Check resources and intent compatibility
        run: .venv/bin/thalovant-skillkit check
      - name: Build and verify both distributions
        run: |
          .venv/bin/python -m build
          .venv/bin/python -m twine check --strict dist/*
          .venv/bin/thalovant-skillkit check-artifacts --wheel dist/*.whl --sdist dist/*.tar.gz
      - name: Test the installed wheel, including native OVOS turns
        run: .venv/bin/python .github/scripts/check_installed.py dist/*.whl

      - name: Validate the wheel against the tag
        id: wheel
        env:
          PACKAGE: "thalovant-skill-interaction-modes"
          CHANNEL_OVERRIDE: ""
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import hashlib, os, sys
          from pathlib import Path
          from packaging.utils import InvalidWheelFilename, canonicalize_name, parse_wheel_filename
          from packaging.version import InvalidVersion, Version

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          wheel = next(Path("dist").glob("*.whl"))
          tag = os.environ["RELEASE_TAG"]
          expected = os.environ.get("PACKAGE", "")
          try:
              name, _version, _build, _tags = parse_wheel_filename(wheel.name)
          except InvalidWheelFilename as exc:
              fail(f"{wheel.name}: {exc}")
          version_text = wheel.name.split("-")[1]
          try:
              if str(Version(version_text)) != version_text:
                  fail(f"wheel version {version_text!r} is not canonical PEP 440 (expected {Version(version_text)})")
          except InvalidVersion as exc:
              fail(str(exc))
          if tag != f"v{version_text}":
              fail(f"tag {tag} does not match the built wheel version {version_text}; bump the package version (or fix the tag) and release again")
          if expected and canonicalize_name(expected) != name:
              fail(f"inputs.package {expected!r} canonicalises to {canonicalize_name(expected)!r} but the wheel is for {name!r}")
          # Channel from the tag shape unless the caller overrides it: a
          # pre-release (a/b/rc/dev) is alpha, a final version is stable.
          channel = os.environ.get("CHANNEL_OVERRIDE", "").strip().lower()
          if not channel:
              channel = "alpha" if Version(version_text).is_prerelease else "stable"
          print(f"channel={channel}")
          print(f"package={name}")
          print(f"version={version_text}")
          print(f"filename={wheel.name}")
          print(f"path={wheel}")
          print(f"sha256={hashlib.sha256(wheel.read_bytes()).hexdigest()}")
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist/
      - name: Attach the verified wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [ "$CHANNEL" = alpha ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
          mkdir existing
          for asset in dist/*; do
            name=$(basename "$asset")
            if gh release download "$RELEASE_TAG" --pattern "$name" --dir existing; then
              cmp "$asset" "existing/$name" || {
                echo "::error::Existing release asset differs: $name; publish a new version"
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.thalovant.com
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist/
      - name: Publish the wheel through the marketplace API
        env:
          THALOVANT_RELEASE_TOKEN: ${{ secrets.THALOVANT_RELEASE_TOKEN }}
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          WHEEL_PATH: ${{ needs.build.outputs.path }}
          WHEEL_SHA256: ${{ needs.build.outputs.sha256 }}
          SLUG: ${{ needs.build.outputs.package }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          CHANGELOG: "See the matching GitHub release for changes."
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request, uuid
          from pathlib import Path

          api = os.environ["API_BASE"].rstrip("/")
          token = os.environ["THALOVANT_RELEASE_TOKEN"]
          if not token:
              sys.exit("::error::THALOVANT_RELEASE_TOKEN is not configured")
          package, version = os.environ["PACKAGE"], os.environ["VERSION"]
          slug, channel = os.environ["SLUG"], os.environ["CHANNEL"]
          changelog = os.environ.get("CHANGELOG", "").strip()
          wheel = Path(os.environ["WHEEL_PATH"])
          expected_sha = os.environ["WHEEL_SHA256"]

          def request(method, path, body=None, content_type=None):
              headers = {"User-Agent": "thalovant-skill-release/1 (GitHub Actions; +https://github.com/thalovant/skill-index)", "Authorization": f"Bearer {token}", "Accept": "application/json"}
              if content_type:
                  headers["Content-Type"] = content_type
              req = urllib.request.Request(api + path, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      raw = resp.read()
                      return resp.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      return exc.code, json.loads(raw)
                  except ValueError:
                      return exc.code, raw.decode(errors="replace")

          def multipart(fields, file_field, path):
              boundary = f"----thalovant-{uuid.uuid4().hex}"
              parts = []
              for key, value in fields.items():
                  parts.append(
                      f"--{boundary}\r\nContent-Disposition: form-data; name=\"{key}\"\r\n\r\n".encode()
                      + str(value).encode() + b"\r\n"
                  )
              parts.append(
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"{file_field}\"; "
                  f"filename=\"{path.name}\"\r\nContent-Type: application/octet-stream\r\n\r\n".encode()
                  + path.read_bytes() + b"\r\n"
              )
              parts.append(f"--{boundary}--\r\n".encode())
              return b"".join(parts), f"multipart/form-data; boundary={boundary}"

          def curl_for(skill_id):
              parts = [f"-F version={version}", f"-F channel={channel}"]
              if changelog:
                  parts.append("-F changelog=@CHANGELOG.txt")
              parts.append(f"-F wheel=@{wheel.name}")
              return (
                  f"curl -sS -X POST {api}/v1/marketplace/skills/{skill_id}/versions "
                  "-H 'Authorization: Bearer $THALOVANT_RELEASE_TOKEN' " + " ".join(parts)
              )

          def warn_not_in_marketplace(detail):
              print(f"::warning::{package} {version} was built but not published: {detail}")
              print("Add the skill to the marketplace (catalog/catalog.yaml in thalovant-api, or "
                    f"POST {api}/v1/marketplace/skills), then publish the wheel by hand:")
              print(curl_for("<marketplace_skill_id>"))

          # The versions endpoint is keyed by the skill's UUID; the slug is its
          # skill_id, so resolve it from the list first.
          status, skills = request("GET", "/v1/marketplace/skills?include_inactive=true")
          if status in (401, 403):
              sys.exit(f"::error::marketplace list returned {status}: token lacks hubs:read/hubs:write or is invalid: {skills}")
          if status != 200:
              sys.exit(f"::error::marketplace list returned {status}: {skills}")
          rows = skills.get("data", []) if isinstance(skills, dict) else []
          matches = [r for r in rows if r.get("skill_id") == slug] or \
                    [r for r in rows if (r.get("package_name") or "") == package]
          if not matches:
              warn_not_in_marketplace(f"no marketplace skill with skill_id={slug!r} or package_name={package!r}")
              sys.exit(1)
          skill_id = matches[0]["id"]

          fields = {"version": version, "channel": channel}
          if changelog:
              fields["changelog"] = changelog
          body, content_type = multipart(fields, "wheel", wheel)
          status, resp = request("POST", f"/v1/marketplace/skills/{skill_id}/versions", body, content_type)
          published_now = status == 201
          if status == 201:
              print(f"published {package} {version} on channel {channel} as marketplace skill {skill_id}")
              if isinstance(resp, dict):
                  got = resp.get("sha256")
                  if got != expected_sha:
                      sys.exit(f"::error::API stored sha256 {got} but the built wheel is {expected_sha}")
          elif status == 404:
              warn_not_in_marketplace(f"POST returned 404: {resp}")
              sys.exit(1)
          elif status == 409:
              idempotent = isinstance(resp, dict) and bool(
                  resp.get("idempotent") or (isinstance(resp.get("detail"), dict) and resp["detail"].get("idempotent"))
              )
              if idempotent:
                  print(f"::warning::{package} {version} was already published with identical contents; nothing to do ({resp})")
              else:
                  sys.exit(f"::error::{package} {version} already exists in the index and wheels are immutable; bump the version and release again ({resp})")
          elif status == 422:
              detail = resp.get("detail") if isinstance(resp, dict) else resp
              sys.exit(f"::error::marketplace rejected the release (422): {detail}")
          elif 400 <= status < 500:
              sys.exit(f"::error::marketplace refused the release ({status}): {resp}")
          else:
              print(curl_for(skill_id))
              sys.exit(f"::error::marketplace returned {status}: {resp}")

          # The API inserts the version row after pushing the index, so it is
          # listed at once; a short poll only covers read replicas or a retry.
          # Even a retry must leave the requested version/channel discoverable.
          deadline = time.monotonic() + (120 if published_now else 10)
          listed = None
          while True:
              status, versions = request("GET", f"/v1/marketplace/skills/{skill_id}/versions")
              items = versions.get("items", []) if isinstance(versions, dict) else []
              listed = next((v for v in items if v.get("version") == version and v.get("channel") == channel), None)
              if listed or time.monotonic() >= deadline:
                  break
              time.sleep(5)
          if not listed:
              message = f"{version} on channel {channel} is not listed by GET /v1/marketplace/skills/{skill_id}/versions (last status {status}: {versions})"
              if published_now:
                  sys.exit(f"::error::{message}")
              sys.exit(f"::error::{message}")

          summary = {
              "skill_id": skill_id, "slug": slug, "package": package, "version": version,
              "channel": channel, "sha256": expected_sha,
              **{k: resp.get(k) for k in ("wheel_path", "index_url") if isinstance(resp, dict) and resp.get(k)},
              "source_ref": listed.get("source_ref"),
          }
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"## Released {package} {version} ({channel})\n\n")
              for key, value in summary.items():
                  fh.write(f"- **{key}**: `{value}`\n")
          PY
