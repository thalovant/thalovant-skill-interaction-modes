name: Package artifacts

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
      - run: python -m pip install build twine "thalovant-skillkit>=0.25.0"
      # Rebuild from the sdist: a direct wheel build can hide missing inputs.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python .github/scripts/check_installed.py dist/*.whl
      - run: thalovant-skillkit check-artifacts --wheel dist/*.whl --sdist dist/*.tar.gz
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
