# Every Thalovant skill's intents are trained into one classifier per language
# on the hub, so a sentence this skill publishes must not already be another
# skill's: one of the two would answer and the other's line would never fire,
# and neither skill's own suite can see it, because each loads one skill.
#
# The fleet's model on the Hugging Face Hub carries an index of every sentence
# every skill publishes, and the classifier itself. It is public, so this needs
# no token. A sentence this change claims from another skill fails, annotated
# on its line; a collision the fleet already carries is reported without
# failing, and a sentence the classifier reads as another skill's warns.
name: Intent collisions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  intents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads the checkout and then runs code installed from
          # PyPI; it never pushes. Leaving GITHUB_TOKEN in the workspace's
          # git config would hand that code a credential it has no use for.
          persist-credentials: false
          fetch-depth: 2
      - name: Check whether runtime tests are needed
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
        if: steps.scope.outputs.run_tests == 'true'
        id: python
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', '**/requirements*.txt', 'uv.lock',
            '.github/workflows/*.yml') }}
        if: steps.scope.outputs.run_tests == 'true'
      - run: python -m pip install "thalovant-skillkit>=0.22.0"
        if: steps.scope.outputs.run_tests == 'true'
      - run: thalovant-skillkit check --fleet-only
        if: steps.scope.outputs.run_tests == 'true'
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
